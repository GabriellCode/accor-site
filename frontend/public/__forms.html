<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Formulários Netlify - ACCOR Reforço Escolar</title>
  </head>
  <body>
    <form name="solicitacao-reforco" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="solicitacao-reforco" />
      <input type="text" name="nomeResponsavel" />
      <input type="text" name="nomeAluno" />
      <input type="tel" name="telefone" />
      <input type="text" name="serieEscolar" />
      <input type="text" name="disciplinaInteresse" />
      <input type="text" name="modalidade" />
      <textarea name="mensagem"></textarea>
    </form>

    <form name="avaliacao-reforco" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="avaliacao-reforco" />
      <input type="text" name="nomeAutor" />
      <input type="email" name="emailGoogle" />
      <input type="text" name="papel" />
      <input type="text" name="disciplina" />
      <input type="number" name="estrelas" />
      <input type="text" name="resultado" />
      <textarea name="comentario"></textarea>
    </form>
  </body>
</html>

spring.application.name=reforco-escolar
server.port=8080

# Configuracao Tomcat para suportar picos de 1000 conexoes simultaneas
server.tomcat.threads.max=250
server.tomcat.accept-count=1000
server.tomcat.max-connections=2000

# Configuracao SQLite (Otimizado para multiplos acessos simultaneos sem SQLITE_BUSY)
spring.datasource.url=jdbc:sqlite:accor.db?busy_timeout=60000&journal_mode=WAL&synchronous=NORMAL
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=120000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging
logging.level.com.accor.reforcoescolar=INFO
